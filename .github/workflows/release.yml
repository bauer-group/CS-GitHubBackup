name: 🚀 Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'docker-compose.yml'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'force create release'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read  # Pull internal/private GHCR packages

jobs:
  # ============================================
  # Validation Jobs
  # ============================================

  validate-compose:
    name: 🔍 Validate Docker Compose
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: '["docker-compose.yml"]'
      env-template: |
        {
          "GITHUB_OWNER": "my-org",
          "GITHUB_PAT": "ghp_xxxxxxxxxxxx",
          "S3_ENDPOINT_URL": "https://minio.example.com",
          "S3_BUCKET": "github-backups",
          "S3_ACCESS_KEY": "access-key",
          "S3_SECRET_KEY": "secret-key"
        }

  validate-scripts:
    name: 🔍 Validate Shell Scripts
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-shellscript.yml@main
    with:
      scan-directory: '.'
      severity: 'error'

  # The image's test stage runs pytest, so building the image runs the
  # test suite on the same Python and dependencies that ship. Nothing is
  # pushed.
  build-test:
    name: 🧪 Build Image & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Docker Hub throttles (429) and times out shared runner IPs. Pull
      # Docker Hub images through Google's public mirror; Docker falls
      # back to Docker Hub for anything the mirror does not hold.
      - name: Use mirror.gcr.io for Docker Hub pulls
        run: |
          config=/etc/docker/daemon.json
          { sudo cat "$config" 2>/dev/null || echo '{}'; } \
            | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' \
            | sudo tee "$config.new" > /dev/null
          sudo mv "$config.new" "$config"
          sudo systemctl restart docker
          docker info --format 'Registry mirrors: {{.RegistryConfig.Mirrors}}'

      - name: Build image (runs pytest)
        run: docker build --progress=plain --tag github-backup:ci .

  # ============================================
  # Release Job (only on main branch push)
  # ============================================

  release:
    name: 📦 Create Semantic Release
    needs: [validate-compose, validate-scripts, build-test]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.validate-compose.result == 'success' &&
      needs.validate-scripts.result == 'success' &&
      needs.build-test.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit
