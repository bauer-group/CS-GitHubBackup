# =============================================================================
# Docker Maintenance - Auto-merge Dependabot PRs
# =============================================================================
# Decides on every Dependabot PR and merges it only once the PR CI named
# in required-workflows has run on it and passed. After a merge,
# release.yml runs on main and creates the semantic release.
#
# Flow:
# ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
# │  Dependabot     │────▶│  PR Created     │────▶│  Docker Build   │
# │  Finds Update   │     │  (base image)   │     │  Validates      │
# └─────────────────┘     └─────────────────┘     └────────┬────────┘
#                                                          │
#                                                          ▼
# ┌─────────────────┐     ┌─────────────────┐     ┌─────────────────┐
# │  New Release    │◀────│  Auto-Merged    │◀────│  All Checks     │
# │  + Docker Push  │     │  to main        │     │  Pass ✅        │
# └─────────────────┘     └─────────────────┘     └─────────────────┘
# =============================================================================

name: 🔧 Docker Maintenance

on:
  # No paths filter: every Dependabot PR - docker, github-actions, pip
  # security updates and any ecosystem added later - reaches the module
  # and gets a decision with an annotation instead of silently staying
  # open. GitHub Actions updates and other .github/ changes stay manual
  # by the module's own guard; jobs of non-Dependabot PRs are skipped.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    name: Auto-merge Dependabot PRs
    uses: bauer-group/automation-templates/.github/workflows/docker-maintenance-dependabot.yml@main
    with:
      merge-method: 'squash'
      auto-approve: true
      # The repository's CI. Its PR run validates the compose file and the
      # shell scripts but builds no image and runs no test, so it does not
      # start for a Dockerfile or pip requirements change: Docker base
      # image and pip updates stay open as "not tested" for review.
      required-workflows: '.github/workflows/release.yml'
    secrets: inherit
